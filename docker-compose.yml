version: '3.8'

services:
  # 1. THE DRUMMER (MySQL Database)
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Resume_DataBase
    ports:
      - "3306:3306"

  # 2. THE PIANIST (Your Java App)
  backend-app:
    image: jayakris22/resume-radar:latest
    ports:
      - "8080:8080"
    environment:
      # This is where the Conductor injects the variable into your app!
      DB_HOST: mysql-db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - mysql-db
