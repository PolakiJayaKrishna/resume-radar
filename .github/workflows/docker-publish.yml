name: Publish Docker Image

# When should the robot wake up?
on:
  push:
    branches: [ "main" ]

# What should the robot do?
jobs:
  build-and-push:
    # Rent a free Ubuntu Linux computer from GitHub
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your code onto the rented computer
    - name: Check out code
      uses: actions/checkout@v4

    # Step 2: Log into Docker Hub using your secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    # Step 3: Run 'docker build' and 'docker push'
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # This tags your image as: jayakris22/resume-radar:latest
        tags: ${{ secrets.DOCKER_USERNAME }}/resume-radar:latest
